version: '3.8'

services:
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: db
      DATABASE_URL: postgresql://postgres:postgres@db:${DB_PORT}/task_db
    depends_on:
      - db
    volumes:
      - .:/app
    command: sh -c "until nc -z db ${DB_PORT}; do sleep 1; done; npm run dev"

  db:
    image: postgres:14-alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
