name: CI/CD for Vercel

on:
  push:
    branches: [main, feature/sequelize]
  pull_request:
    branches: [main, feature/sequelize]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'  

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
      run: |
        npm ci || npm install
        npm install pg --force

      - name: Build application
        run: npm run build

      - name: Debug environment
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Working directory: $(pwd)"
          ls -la

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: List and remove old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          echo "Listing current deployments..."
          vercel list $VERCEL_PROJECT_ID --token $VERCEL_TOKEN --yes
          
          echo "Removing old deployments..."
          vercel remove $VERCEL_PROJECT_ID --token $VERCEL_TOKEN --yes || true

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          vercel deploy --token $VERCEL_TOKEN --prod \
            --env DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --env DATABASE_SSL=true \
            --yes