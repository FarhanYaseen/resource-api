name: CI/CD Pipeline

on:
  push:
    branches: [feature/deployment]
  pull_request:
    branches: [feature/deployment]

env:
  DOCKER_IMAGE: resource-api
  PORT: 3001
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: task_db

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Run tests
      run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

    - name: Deploy using Docker Compose
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        password: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to deployment directory
          mkdir -p ~/deploy
          cd ~/deploy
          
          # Pull the latest Docker image
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

          # Update docker-compose.yml dynamically
          cat > docker-compose.yml <<EOL
          version: '3.8'

          services:
            api:
              image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
              ports:
                - "${PORT}:${PORT}"
              environment:
                NODE_ENV: production
                PORT: ${PORT}
                DB_HOST: db
                DB_PORT: ${DB_PORT}
                DB_USERNAME: ${DB_USERNAME}
                DB_PASSWORD: ${DB_PASSWORD}
                DB_DATABASE: ${DB_DATABASE}
              depends_on:
                - db
              volumes:
                - .:/app
              command: sh -c "until nc -z db ${DB_PORT}; do sleep 1; done; npm start"

            db:
              image: postgres:14-alpine
              ports:
                - "${DB_PORT}:5432"
              environment:
                POSTGRES_USER: ${DB_USERNAME}
                POSTGRES_PASSWORD: ${DB_PASSWORD}
                POSTGRES_DB: ${DB_DATABASE}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
                interval: 30s
                timeout: 10s
                retries: 5

          volumes:
            postgres_data:
          EOL

          # Restart services with the updated Docker Compose configuration
          docker compose down
          docker compose up -d

          # Clean up old images
          docker image prune -af
